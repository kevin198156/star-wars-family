name: Static checks

on:
  pull_request:
  push:
    branches:
      - security-hardening-2026-09-20

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S | re.I)

          classic = []
          module = []
          for attrs, body in scripts:
              if "src=" in attrs.lower():
                  continue
              if 'type="module"' in attrs.lower() or "type='module'" in attrs.lower():
                  module.append(body)
              else:
                  classic.append(body)

          Path("/tmp/classic.js").write_text("\n".join(classic), encoding="utf-8")
          Path("/tmp/module.mjs").write_text("\n".join(module), encoding="utf-8")
          PY
          node --check /tmp/classic.js
          node --check /tmp/module.mjs
      - name: Check for conflict markers
        run: |
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' index.html AGENTS.md
